version: 0.1.0
namespace: bonsai.cognition

Cognition:
  definition: Processes that transform observations and knowledge into internal representations and inferences.
  includes:
    - Perception
    - Attention
    - Representation
    - Reasoning
    - Prediction
    - Evaluation
    - Abstraction

Attention:
  definition: Selection of information relevant to the current task or goal.
Representation:
  definition: A structured internal form used to preserve or manipulate information.
Prediction:
  definition: Estimation of a future state or outcome from available evidence.
Evaluation:
  definition: Comparison of alternatives, states, or outcomes against criteria.
Abstraction:
  definition: Compression of details into reusable concepts while preserving relevant structure.
